<text x="60" y="346" class="small">AB = [[5, 4], [1, 2]]</text>
<text x="60" y="372" class="small">The first entry is 1×3 + 2×1 = 5.</text>
<text x="60" y="398" class="small">Each output entry combines a row of A with a column of B.</text>
<text x="46" y="453" class="body">Follow-up: Why is reversing the order different?</text>
