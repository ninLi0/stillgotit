<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title description">
<title id="title">Learn matrix multiplication from your course material</title>
<desc id="description">A course passage sits beside an AI explanation. The learner asks why matrix multiplication uses whole columns, then starts a fresh practice problem.</desc>
<rect x="0.5" y="0.5" width="919" height="719" rx="12" fill="#fafafa" stroke="#ccc"/>
<style>text{font-family:Arial,sans-serif;fill:#242424}.small{font-size:13px;fill:#606060}.body{font-size:16px}.heading{font-size:19px;font-weight:600}.title{font-size:27px;font-weight:600}.brand{font-family:Georgia,serif;font-size:24px}.button{font-size:14px}.white{fill:white}</style>
<text x="26" y="38" class="brand">StillGotIt</text>
<text x="684" y="35" class="small">Linear algebra · Design sketch</text>
<path d="M0 58H920" stroke="#d4d4d4"/>
<text x="26" y="101" class="title">Understand the method before you practice.</text>
<text x="26" y="129" class="small">Matrix multiplication · Ask questions and check the source behind an explanation.</text>

<rect x="26" y="154" width="285" height="424" rx="7" fill="white" stroke="#d2d2d2"/>
<circle cx="51" cy="181" r="12" fill="#222"/>
<text x="51" y="185" text-anchor="middle" class="small white">1</text>
<text x="73" y="187" class="heading">Your course material</text>
<text x="46" y="227" class="body">Lecture 4 — Matrices.pdf</text>
<text x="46" y="252" class="small">Selected passage · page 3</text>
<rect x="46" y="272" width="245" height="143" fill="#f7f7f7" stroke="#ddd"/>
<text x="60" y="302" class="body">Column j of AB is A times</text>
<text x="60" y="329" class="body">column j of B.</text>
<text x="60" y="365" class="small">Apply the same transformation</text>
<text x="60" y="388" class="small">to each input column.</text>
<rect x="46" y="442" width="166" height="38" rx="7" fill="white" stroke="#aaa"/>
<text x="60" y="466" class="button">Open source page</text>
<text x="46" y="514" class="small">Read the passage in context.</text>
<text x="46" y="537" class="small">The explanation keeps this reference.</text>

<rect x="331" y="154" width="563" height="424" rx="7" fill="white" stroke="#d2d2d2"/>
<circle cx="356" cy="181" r="12" fill="#222"/>
<text x="356" y="185" text-anchor="middle" class="small white">2</text>
<text x="378" y="187" class="heading">AI explanation: one column at a time</text>
<rect x="351" y="205" width="523" height="124" rx="7" fill="#f7f7f7" stroke="#d2d2d2"/>
<text x="367" y="231" class="body">A = [[2, 1], [−1, 3]]</text>
<text x="610" y="231" class="body">Input column v = (4, 2)</text>
<text x="367" y="262" class="body">Av = (2×4 + 1×2, −1×4 + 3×2) = (10, 2)</text>
<text x="367" y="292" class="small">Each row gives one component of the output.</text>
<text x="367" y="314" class="small">For AB, repeat this step for each column of B.</text>
<text x="351" y="351" class="small">Based on Lecture 4, page 3. This example is AI-generated.</text>

<circle cx="356" cy="385" r="12" fill="#222"/>
<text x="356" y="389" text-anchor="middle" class="small white">3</text>
<text x="378" y="391" class="heading">Ask about this step</text>
<text x="351" y="425" class="body">You: Why not just multiply matching entries?</text>
<text x="351" y="455" class="body">AI: Each column is an input vector. A acts on the</text>
<text x="351" y="479" class="body">whole vector to produce one output column.</text>
<rect x="351" y="514" width="367" height="42" rx="7" fill="white" stroke="#aaa"/>
<text x="365" y="540" class="small">Type a follow-up question…</text>
<rect x="730" y="514" width="65" height="42" rx="7" fill="white" stroke="#aaa"/>
<text x="742" y="540" class="button">Speak</text>
<rect x="807" y="514" width="67" height="42" rx="7" fill="white" stroke="#aaa"/>
<text x="821" y="540" class="button">Send</text>

<text x="26" y="618" class="heading">Ready to try it?</text>
<text x="26" y="644" class="small">A fresh problem checks what you can do. Request a hint if needed.</text>
<circle cx="708" cy="628" r="12" fill="#222"/>
<text x="708" y="632" text-anchor="middle" class="small white">4</text>
<rect x="732" y="607" width="162" height="42" rx="7" fill="#222" stroke="#222"/>
<text x="755" y="633" class="button white">Start practice</text>
<path d="M26 678H894" stroke="#d4d4d4"/>
<text x="26" y="702" class="small">Illustrative source and conversation. Numbered notes are explained in the design document.</text>
</svg>
