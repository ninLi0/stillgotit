<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img">
<title>Explain photographed work in a voice conversation</title>
<rect x="0.5" y="0.5" width="919" height="649" rx="12" fill="#fafafa" stroke="#ccc"/>
<style>text{font-family:Arial,sans-serif;fill:#242424}.small{font-size:13px;fill:#606060}.body{font-size:16px}.heading{font-size:19px;font-weight:600}.title{font-size:27px;font-weight:600}.brand{font-family:Georgia,serif;font-size:24px}.button{font-size:14px}.white{fill:white}.paper{font-family:Georgia,serif;font-size:19px;font-style:italic}</style>
<text x="26" y="38" class="brand">StillGotIt</text><text x="675" y="35" class="small">Physics · Design sketch</text>
<path d="M0 58H920" stroke="#d4d4d4"/>
<text x="26" y="100" class="title">Show your working. Talk through your reasoning.</text>
<text x="26" y="128" class="small">Applying Newton’s laws · Independent check · Original images and conversation stay together.</text>
<rect x="26" y="154" width="436" height="418" rx="7" fill="white" stroke="#d2d2d2"/>
<circle cx="51" cy="181" r="12" fill="#222"/><text x="51" y="185" text-anchor="middle" class="small white">1</text>
<text x="73" y="187" class="heading">Your paper · Page 1 of 2</text><text x="357" y="186" class="small">Enlarge</text>
<rect x="46" y="207" width="396" height="282" fill="#f7f7f7" stroke="#ddd"/>
<text x="64" y="236" class="paper">A block on a frictionless incline</text>
<path d="M84 337L294 267L294 337Z" fill="none" stroke="#777" stroke-width="1.5"/>
<g transform="translate(185 303) rotate(-18.4)"><rect x="-20" y="-30" width="40" height="30" fill="white" stroke="#333"/><text x="-7" y="-10" class="paper">m</text></g>
<path d="M185 284V349M181 342L185 349L189 342" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="197" y="355" class="paper">mg</text><text x="113" y="328" class="paper">θ</text>
<text x="64" y="391" class="paper">ΣF along slope = ma</text><text x="64" y="423" class="paper">mg sin θ = ma</text><text x="64" y="455" class="paper">a = g sin θ</text>
<text x="280" y="474" class="small">Illustrative paper work</text>
<rect x="46" y="514" width="123" height="38" rx="7" fill="white" stroke="#aaa"/><text x="60" y="538" class="button">Take photo</text>
<rect x="180" y="514" width="115" height="38" rx="7" fill="white" stroke="#aaa"/><text x="193" y="538" class="button">Upload page</text>
<rect x="306" y="514" width="136" height="38" rx="7" fill="white" stroke="#aaa"/><text x="319" y="538" class="button">Retake / reorder</text>
<rect x="482" y="154" width="412" height="418" rx="7" fill="white" stroke="#d2d2d2"/>
<circle cx="507" cy="181" r="12" fill="#222"/><text x="507" y="185" text-anchor="middle" class="small white">2</text>
<text x="529" y="187" class="heading">Voice conversation</text><text x="796" y="186" class="small">Mic on</text>
<text x="502" y="227" class="small">AI · Spoken question</text>
<text x="502" y="252" class="body">Why did you choose axes along the incline?</text>
<text x="502" y="291" class="small">You · Recognized speech</text>
<text x="502" y="316" class="body">“I want to separate the component of gravity</text>
<text x="502" y="341" class="body">that causes motion down the slope.”</text>
<text x="502" y="380" class="small">AI · Conceptual follow-up</text>
<text x="502" y="405" class="body">How does your result behave when θ is zero?</text>
<circle cx="509" cy="446" r="12" fill="#222"/><text x="509" y="450" text-anchor="middle" class="small white">3</text>
<text x="531" y="451" class="small">Misheard a phrase? Correct the transcript.</text>
<text x="502" y="483" class="small">Unclear symbols prompt clarification, not a penalty.</text>
<rect x="502" y="514" width="168" height="38" rx="7" fill="#222" stroke="#222"/><text x="518" y="538" class="button white">Pause microphone</text>
<rect x="684" y="514" width="190" height="38" rx="7" fill="white" stroke="#aaa"/><text x="700" y="538" class="button">Type instead</text>
<text x="26" y="602" class="small">No hints used · Assessment starts after you submit the work and conversation.</text>
<rect x="692" y="582" width="202" height="38" rx="7" fill="#222" stroke="#222"/><text x="708" y="606" class="button white">Finish and submit</text>
<text x="26" y="636" class="small">Static interaction sketch. Voice and image input are design requirements, not an implemented pipeline.</text>
</svg>
